# Configurare generala pentru pipeline-ul de generare YouTube Shorts

video:
  width: 1080
  height: 1920
  fps: 30
  # Sub 180s, altfel YouTube il posteaza ca video normal, nu ca Short.
  # Lasam o marja sub 180 pentru cazurile in care scriptul genereaza
  # putin mai mult text decat tinta.
  max_duration_seconds: 150
  output_dir: "output"

character:
  # Imagini PNG cu personajul in diferite pozitii/expresii (fundal transparent)
  assets_dir: "assets/characters"
  positions:
    - name: "neutral"
      file: "neutral.png"
    - name: "smile"
      file: "smile.png"
    - name: "pointing"
      file: "pointing.png"
    - name: "explaining"
      file: "explaining.png"
    - name: "thinking"
      file: "thinking.png"
    - name: "surprised"
      file: "surprised.png"
    - name: "scared"
      file: "scared.png"
    - name: "laughing"
      file: "laughing.png"
  # Pozitie si scalare implicita pe canvas (procent din latime/inaltime)
  default_scale: 1.35
  default_position: ["center", "bottom"]

background:
  assets_dir: "assets/backgrounds"
  default: "cabin_horror_1.png"

subtitles:
  enabled: true
  font: "DejaVu-Sans-Bold"
  font_size: 64
  color: "white"
  highlight_color: "#FFD400"
  stroke_color: "black"
  stroke_width: 3
  position_y_ratio: 0.10

audio:
  music_dir: "assets/music"
  music_volume: 0.15
  voice_volume: 1.0

tts:
  provider: "edge_tts"
  language: "ro"
  voice: "ro-RO-EmilNeural"
  # O singura voce (masculina, groasa - vikingul nostru) pentru tot textul,
  # romana si engleza deopotriva. Cuvintele/numele straine sunt scrise fonetic
  # in scenariu (vezi instructiunile de pronuntie), nu schimbate de voce.
  voices:
    - "ro-RO-EmilNeural"
  rate: "+0%"
  pitch: "-5Hz"
  # Variatie aleatoare per segment, pentru o voce mai naturala/umana
  # (nu identica monoton de la un segment la altul).
  rate_jitter: 3
  pitch_jitter: 4

script_generation:
  provider: "claude"
  # claude-haiku-4-5 este cel mai rapid si mai ieftin model Claude,
  # suficient de bun pentru scenarii structurate JSON. ~$1/1M tokeni input.
  model: "claude-haiku-4-5"
  max_tokens: 3000
  language: "ro"

trending:
  # "youtube" foloseste YouTube Data API (ce vede lumea pe platforma chiar acum)
  # ca sursa primara, cu Google Trends RSS ca fallback gratuit.
  provider: "youtube"
  geo: "RO"
  topics_count: 8

scheduling:
  daily_run_time: "18:00"
  timezone: "Europe/Bucharest"

youtube:
  category_id: "24"  # Entertainment
  privacy_status: "public"  # private | unlisted | public
  default_tags:
    - "shorts"
    - "trending"
    - "romania"

telegram:
  notify_on_start: true
  notify_on_finish: true
  require_approval_before_upload: false

# Serial narativ pe episoade (videoclipuri lungi, orizontale, 16:9).
# Continuitatea (memoria povestii) este salvata in baza de date (tabela "runs",
# folosita generic) intre episoade, astfel incat fiecare episod nou continua
# direct din finalul celui precedent.
series:
  enabled: true
  slug: "saga-vikingilor"
  genre: "actiune, drama si horror nordic, cu cliffhanger-uri puternice la final de episod"
  total_episodes: 100
  output_dir: "output/series"
  video:
    width: 1920
    height: 1080
    fps: 30
    # Pornim cu 10 minute pentru a testa timpii de generare/randare;
    # poate fi crescut spre 1800 (30 minute) ulterior.
    max_duration_seconds: 600
  # Personajul (vikingul narator) e mai mic si pozitionat in colt, pentru
  # a nu acoperi scena pe un cadru orizontal.
  character_scale: 0.45
  character_position: ["right", "bottom"]
  script_generation:
    max_tokens: 8192
