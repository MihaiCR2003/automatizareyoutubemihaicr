# Configurare generala pentru pipeline-ul de generare YouTube Shorts

video:
  width: 1080
  height: 1920
  fps: 30
  # Sub 180s, altfel YouTube il posteaza ca video normal, nu ca Short.
  # Lasam o marja sub 180 pentru cazurile in care scriptul genereaza
  # putin mai mult text decat tinta.
  max_duration_seconds: 150
  output_dir: "output"

character:
  # Imagini PNG cu personajul in diferite pozitii/expresii (fundal transparent)
  assets_dir: "assets/characters"
  positions:
    - name: "neutral"
      file: "neutral.png"
    - name: "smile"
      file: "smile.png"
    - name: "pointing"
      file: "pointing.png"
    - name: "explaining"
      file: "explaining.png"
    - name: "thinking"
      file: "thinking.png"
    - name: "surprised"
      file: "surprised.png"
    - name: "scared"
      file: "scared.png"
    - name: "laughing"
      file: "laughing.png"
  # Pozitie si scalare implicita pe canvas (procent din latime/inaltime)
  default_scale: 1.35
  default_position: ["center", "bottom"]

background:
  assets_dir: "assets/backgrounds"
  default: "cabin_horror_1.png"

subtitles:
  enabled: true
  font: "DejaVu-Sans-Bold"
  font_size: 64
  color: "white"
  highlight_color: "#FFD400"
  stroke_color: "black"
  stroke_width: 3
  position_y_ratio: 0.10

audio:
  music_dir: "assets/music"
  music_volume: 0.15
  voice_volume: 1.0

tts:
  provider: "edge_tts"
  language: "ro"
  voice: "ro-RO-EmilNeural"
  # O singura voce (masculina, groasa - vikingul nostru) pentru tot textul,
  # romana si engleza deopotriva. Cuvintele/numele straine sunt scrise fonetic
  # in scenariu (vezi instructiunile de pronuntie), nu schimbate de voce.
  voices:
    - "ro-RO-EmilNeural"
  rate: "+0%"
  pitch: "-5Hz"
  # Variatie aleatoare per segment, pentru o voce mai naturala/umana
  # (nu identica monoton de la un segment la altul).
  rate_jitter: 3
  pitch_jitter: 4

script_generation:
  provider: "gemini"
  # gemini-2.5-flash-lite are o cota gratuita zilnica mare, suficient
  # pentru 4 shorts + 4 episoade de serial pe zi.
  model: "gemini-2.5-flash-lite"
  max_tokens: 3000
  language: "ro"

trending:
  # "youtube" foloseste YouTube Data API (ce vede lumea pe platforma chiar acum)
  # ca sursa primara, cu Google Trends RSS ca fallback gratuit.
  provider: "youtube"
  geo: "RO"
  topics_count: 8

# Strategia de continut: nisa canalului, filtre si subiecte de rezerva.
content_strategy:
  # Descrierea nisei folosita in promptul AI pentru selectia si scrierea subiectelor.
  niche: "fotbal si sport, istorie si civilizatii antice, secrete si mistere, curiozitati fascinante, stiinta si tehnologie"

  # Cuvinte cheie din titlul subiectului care duc la excluderea lui automata.
  excluded_keywords:
    - vreme
    - meteo
    - prognoza
    - temperaturi
    - precipitatii
    - ploaie
    - ninsoare
    - grindina
    - cod galben
    - cod portocaliu
    - cod rosu
    - furtuna
    - viscol
    - inghet
    - canicular
    - canicula

  # Subiecte de rezerva pe categorii, folosite cand trending-ul nu are subiecte
  # potrivite nisei. Sistemul roteste aleator prin aceste categorii.
  fallback_topics:
    fotbal:
      - "Cel mai scump transfer din istoria fotbalului mondial"
      - "Secretele din vestiarul marilor echipe de fotbal"
      - "Fapte incredibile despre Cristiano Ronaldo pe care nu le stiai"
      - "Cele mai mari rasturnari de scor din istoria fotbalului"
      - "Cum arata o zi din viata unui fotbalist de top"
      - "Cele mai mari scandaluri din istoria fotbalului"
      - "Fotbalisti care au renuntat la milioane si au ales alt drum"
    istorie:
      - "Secretele Egiptului Antic pe care nimeni nu ti le dezvaluie"
      - "Civilizatii misterioase disparute fara urma de pe fata Pamantului"
      - "Fapte socante despre al Doilea Razboi Mondial necunoscute publicului"
      - "Imperiul Roman: secrete pe care cartile de scoala nu le spun"
      - "Cele mai mari misteruri ale istoriei antice inca nerezolvate"
      - "Vikingii: adevarul socant despre acesti razboinici"
      - "Orasele antice ingropate descoperite recent de arheologi"
    secrete:
      - "Locuri de pe Pamant unde accesul public este complet interzis"
      - "Teorii ale conspiratiei confirmate oficial de guverne"
      - "Fenomene inexplicabile filmate pe camera in direct"
      - "Locuri pe Google Maps sterse intentionat si motivul real"
      - "Ce se ascunde cu adevarat in Zona 51"
      - "Organizatii secrete care au influentat istoria lumii"
      - "Experimente secrete ale guvernelor asupra propriilor cetateni"
    curiozitati:
      - "Fapte uimitoare despre corpul uman pe care nu le stiai"
      - "Animale cu superputeri reale demonstrate de stiinta"
      - "Locuri incredibile de pe Pamant care par dintr-un film SF"
      - "Recorduri mondiale imposibil de batut vreodata"
      - "Iluzii optice care iti pacalesc creierul, explicate de stiinta"
      - "Obiceiuri ciudate din tari pe care nu le-ai crede reale"
      - "Fapte despre oceane care iti vor face pielea de gaina"
    stiinta:
      - "Descoperiri stiintifice recente care au schimbat tot ce stiam"
      - "Universul are limite? Ce se afla dincolo de el"
      - "Experimente stiintifice interzise care au schimbat istoria"
      - "Fizica cuantica explicata simplu: lucruri imposibile care se intampla"
      - "Plante carnivore si organisme care sfideaza logica naturii"
    tehnologie:
      - "Inteligenta artificiala poate citi gandurile oamenilor acum"
      - "Cum ne supravegheaza telefoanele fara sa stim"
      - "Gadgeturi din viitor disponibile deja acum"
      - "Robotii care inlocuiesc deja oamenii in aceste meserii"
      - "Internetul viitorului: cum va arata in 2030"

scheduling:
  daily_run_time: "18:00"
  timezone: "Europe/Bucharest"

youtube:
  category_id: "24"  # Entertainment
  privacy_status: "public"  # private | unlisted | public
  default_tags:
    - "shorts"
    - "trending"
    - "romania"

telegram:
  notify_on_start: true
  notify_on_finish: true
  require_approval_before_upload: false

# Serial narativ pe episoade (videoclipuri lungi, orizontale, 16:9).
# Continuitatea (memoria povestii) este salvata in baza de date (tabela "runs",
# folosita generic) intre episoade, astfel incat fiecare episod nou continua
# direct din finalul celui precedent.
series:
  enabled: true
  slug: "saga-vikingilor"
  genre: "actiune, drama si horror nordic, cu cliffhanger-uri puternice la final de episod"
  total_episodes: 100
  output_dir: "output/series"
  video:
    width: 1920
    height: 1080
    fps: 30
    # Pornim cu 10 minute pentru a testa timpii de generare/randare;
    # poate fi crescut spre 1800 (30 minute) ulterior.
    max_duration_seconds: 600
  # Personajul (vikingul narator) e mai mic si pozitionat in colt, pentru
  # a nu acoperi scena pe un cadru orizontal.
  character_scale: 0.45
  character_position: ["right", "bottom"]
  script_generation:
    max_tokens: 8192
