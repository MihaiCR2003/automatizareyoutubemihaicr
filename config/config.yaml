# Configurare generala pentru pipeline-ul de generare YouTube Shorts

video:
  width: 1080
  height: 1920
  fps: 30
  # Sub 180s, altfel YouTube il posteaza ca video normal, nu ca Short.
  # Lasam o marja sub 180 pentru cazurile in care scriptul genereaza
  # putin mai mult text decat tinta.
  max_duration_seconds: 150
  output_dir: "output"

character:
  # Imagini PNG cu personajul in diferite pozitii/expresii (fundal transparent)
  assets_dir: "assets/characters"
  positions:
    - name: "neutral"
      file: "neutral.png"
    - name: "smile"
      file: "smile.png"
    - name: "pointing"
      file: "pointing.png"
    - name: "explaining"
      file: "explaining.png"
    - name: "thinking"
      file: "thinking.png"
    - name: "surprised"
      file: "surprised.png"
    - name: "scared"
      file: "scared.png"
    - name: "laughing"
      file: "laughing.png"
  # Pozitie si scalare implicita pe canvas (procent din latime/inaltime)
  default_scale: 1.35
  default_position: ["center", "bottom"]

background:
  assets_dir: "assets/backgrounds"
  default: "cabin_horror_1.png"

subtitles:
  enabled: true
  font: "DejaVu-Sans-Bold"
  font_size: 64
  color: "white"
  highlight_color: "#FFD400"
  stroke_color: "black"
  stroke_width: 3
  position_y_ratio: 0.10

audio:
  music_dir: "assets/music"
  music_volume: 0.15
  voice_volume: 1.0

tts:
  provider: "edge_tts"
  language: "en"
  voice: "en-US-GuyNeural"
  # Single energetic male English voice for all narration.
  voices:
    - "en-US-GuyNeural"
  rate: "+0%"
  pitch: "-5Hz"
  # Per-segment random variation for a more natural, human-sounding voice.
  rate_jitter: 3
  pitch_jitter: 4

script_generation:
  provider: "gemini"
  # gemini-2.5-flash-lite has a large free daily quota, sufficient
  # for 4 shorts + 4 series episodes per day.
  model: "gemini-2.5-flash-lite"
  max_tokens: 3000
  language: "en"

trending:
  # "youtube" uses YouTube Data API (what people watch right now on the platform)
  # as primary source, with Google Trends RSS as free fallback.
  provider: "youtube"
  geo: "US"
  topics_count: 8

# Strategia de continut: nisa canalului, filtre si subiecte de rezerva.
content_strategy:
  # Niche description used in the AI prompt for topic selection and script writing.
  niche: "football and sports, ancient history and civilizations, secrets and mysteries, mind-blowing facts, science and technology"

  # Keywords in the topic title that trigger automatic exclusion.
  excluded_keywords:
    - weather
    - forecast
    - temperature
    - rainfall
    - snowfall
    - hurricane
    - tornado
    - heatwave
    - blizzard
    - flood warning
    - stock market
    - earnings report

  # Fallback topics by category, used when trending has no suitable niche subjects.
  # The system randomly rotates through these categories.
  fallback_topics:
    football:
      - "The most expensive transfer in football history"
      - "Secrets from the locker rooms of football's greatest clubs"
      - "Incredible facts about Cristiano Ronaldo you never knew"
      - "The biggest score reversals in football history"
      - "What a day in the life of a top footballer actually looks like"
      - "The biggest scandals in football history"
      - "Footballers who walked away from millions and never looked back"
      - "The dark side of football nobody talks about"
    history:
      - "Ancient Egypt secrets no one ever told you"
      - "Mysterious civilizations that vanished without a trace"
      - "Shocking facts about World War II the history books left out"
      - "The Roman Empire: secrets your school never taught you"
      - "The greatest unsolved mysteries of the ancient world"
      - "The Vikings: the shocking truth about these warriors"
      - "Ancient cities recently discovered buried underground"
      - "The most brutal empires in all of human history"
    secrets:
      - "Places on Earth where public access is completely forbidden"
      - "Conspiracy theories that were officially confirmed by governments"
      - "Unexplainable phenomena caught on camera live"
      - "Google Maps locations that were deliberately erased and why"
      - "What is really hidden inside Area 51"
      - "Secret organizations that shaped world history"
      - "Government experiments secretly conducted on their own citizens"
      - "The most classified documents ever declassified"
    facts:
      - "Mind-blowing facts about the human body you never knew"
      - "Animals with real superpowers proven by science"
      - "Unbelievable places on Earth that look like they're from a movie"
      - "World records that can never be broken"
      - "Optical illusions that break your brain, explained by science"
      - "Strange customs from countries around the world you wouldn't believe"
      - "Ocean facts that will give you goosebumps"
      - "Things that exist on Earth that sound completely made up"
    science:
      - "Recent scientific discoveries that changed everything we knew"
      - "Does the universe have a boundary? What lies beyond it"
      - "Forbidden scientific experiments that changed history"
      - "Quantum physics explained simply: impossible things that actually happen"
      - "Carnivorous plants and organisms that defy the logic of nature"
      - "Space discoveries in the last year that shocked astronomers"
    technology:
      - "Artificial intelligence can now read human thoughts"
      - "How your phone spies on you without you knowing"
      - "Future gadgets that already exist today"
      - "Robots that are already replacing humans in these jobs"
      - "What the internet will look like in 2030"
      - "The dark side of social media algorithms nobody tells you"

scheduling:
  daily_run_time: "18:00"
  timezone: "Europe/Bucharest"

youtube:
  category_id: "24"  # Entertainment
  privacy_status: "public"  # private | unlisted | public
  default_tags:
    - "shorts"
    - "trending"
    - "viral"

telegram:
  notify_on_start: true
  notify_on_finish: true
  require_approval_before_upload: false

# Serial narativ pe episoade (videoclipuri lungi, orizontale, 16:9).
# Continuitatea (memoria povestii) este salvata in baza de date (tabela "runs",
# folosita generic) intre episoade, astfel incat fiecare episod nou continua
# direct din finalul celui precedent.
series:
  enabled: true
  slug: "saga-vikingilor"
  genre: "actiune, drama si horror nordic, cu cliffhanger-uri puternice la final de episod"
  total_episodes: 100
  output_dir: "output/series"
  video:
    width: 1920
    height: 1080
    fps: 30
    # Pornim cu 10 minute pentru a testa timpii de generare/randare;
    # poate fi crescut spre 1800 (30 minute) ulterior.
    max_duration_seconds: 600
  # Personajul (vikingul narator) e mai mic si pozitionat in colt, pentru
  # a nu acoperi scena pe un cadru orizontal.
  character_scale: 0.45
  character_position: ["right", "bottom"]
  script_generation:
    max_tokens: 8192
