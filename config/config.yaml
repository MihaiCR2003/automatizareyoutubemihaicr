# Configurare generala pentru pipeline-ul de generare YouTube Shorts

video:
  width: 1080
  height: 1920
  fps: 30
  max_duration_seconds: 60
  output_dir: "output"

character:
  # Imagini PNG cu personajul in diferite pozitii/expresii (fundal transparent)
  assets_dir: "assets/characters"
  positions:
    - name: "idle"
      file: "idle.png"
    - name: "talking"
      file: "talking.png"
    - name: "excited"
      file: "excited.png"
    - name: "pointing"
      file: "pointing.png"
  # Pozitie si scalare implicita pe canvas (procent din latime/inaltime)
  default_scale: 0.6
  default_position: ["center", "bottom"]

background:
  assets_dir: "assets/backgrounds"
  default: "default_bg.mp4"

audio:
  music_dir: "assets/music"
  music_volume: 0.15
  voice_volume: 1.0

tts:
  provider: "elevenlabs"
  language: "ro"
  model: "eleven_multilingual_v2"

script_generation:
  provider: "huggingface"
  model: "mistralai/Mixtral-8x7B-Instruct-v0.1"
  max_tokens: 400
  language: "ro"

trending:
  provider: "google_trends"
  geo: "RO"
  topics_count: 5

scheduling:
  daily_run_time: "18:00"
  timezone: "Europe/Bucharest"

youtube:
  category_id: "22"  # People & Blogs
  privacy_status: "private"  # private | unlisted | public
  default_tags:
    - "shorts"
    - "trending"
    - "romania"

telegram:
  notify_on_start: true
  notify_on_finish: true
  require_approval_before_upload: true
