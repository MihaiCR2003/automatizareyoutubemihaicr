# Configurare generala pentru pipeline-ul de generare YouTube Shorts

video:
  width: 1080
  height: 1920
  fps: 30
  max_duration_seconds: 60
  output_dir: "output"

character:
  # Imagini PNG cu personajul in diferite pozitii/expresii (fundal transparent)
  assets_dir: "assets/characters"
  positions:
    - name: "neutral"
      file: "neutral.png"
    - name: "smile"
      file: "smile.png"
    - name: "pointing"
      file: "pointing.png"
    - name: "explaining"
      file: "explaining.png"
    - name: "thinking"
      file: "thinking.png"
    - name: "surprised"
      file: "surprised.png"
    - name: "scared"
      file: "scared.png"
    - name: "laughing"
      file: "laughing.png"
  # Pozitie si scalare implicita pe canvas (procent din latime/inaltime)
  default_scale: 0.6
  default_position: ["center", "bottom"]

background:
  assets_dir: "assets/backgrounds"
  default: "cabin_horror_1.png"

audio:
  music_dir: "assets/music"
  music_volume: 0.15
  voice_volume: 1.0

tts:
  provider: "elevenlabs"
  language: "ro"
  model: "eleven_multilingual_v2"

script_generation:
  provider: "gemini"
  model: "gemini-2.5-flash"
  max_tokens: 400
  language: "ro"

trending:
  provider: "google_trends"
  geo: "RO"
  topics_count: 5

scheduling:
  daily_run_time: "18:00"
  timezone: "Europe/Bucharest"

youtube:
  category_id: "22"  # People & Blogs
  privacy_status: "private"  # private | unlisted | public
  default_tags:
    - "shorts"
    - "trending"
    - "romania"

telegram:
  notify_on_start: true
  notify_on_finish: true
  require_approval_before_upload: false
