# Configurare generala pentru pipeline-ul de generare YouTube Shorts

video:
  width: 1080
  height: 1920
  fps: 30
  max_duration_seconds: 180
  output_dir: "output"

character:
  # Imagini PNG cu personajul in diferite pozitii/expresii (fundal transparent)
  assets_dir: "assets/characters"
  positions:
    - name: "neutral"
      file: "neutral.png"
    - name: "smile"
      file: "smile.png"
    - name: "pointing"
      file: "pointing.png"
    - name: "explaining"
      file: "explaining.png"
    - name: "thinking"
      file: "thinking.png"
    - name: "surprised"
      file: "surprised.png"
    - name: "scared"
      file: "scared.png"
    - name: "laughing"
      file: "laughing.png"
  # Pozitie si scalare implicita pe canvas (procent din latime/inaltime)
  default_scale: 1.35
  default_position: ["center", "bottom"]

background:
  assets_dir: "assets/backgrounds"
  default: "cabin_horror_1.png"

subtitles:
  enabled: true
  font: "DejaVu-Sans-Bold"
  font_size: 64
  color: "white"
  highlight_color: "#FFD400"
  stroke_color: "black"
  stroke_width: 3
  position_y_ratio: 0.10

audio:
  music_dir: "assets/music"
  music_volume: 0.15
  voice_volume: 1.0

tts:
  provider: "edge_tts"
  language: "ro"
  voice: "ro-RO-EmilNeural"
  voice_en: "en-US-AndrewNeural"
  # Perechi voce romana / voce engleza (pentru cuvinte, nume sau termeni in
  # limba engleza marcati in script cu ~asa~, pronuntate cu o voce nativa
  # engleza pentru acuratete maxima). Doar voci masculine, pentru a se
  # potrivi cu personajul nostru (viking) - voce groasa, dar inteligibila.
  voices:
    - ro: "ro-RO-EmilNeural"
      en: "en-US-AndrewNeural"
    - ro: "ro-RO-EmilNeural"
      en: "en-US-GuyNeural"
  rate: "+0%"
  pitch: "-15Hz"
  # Variatie aleatoare per segment, pentru o voce mai naturala/umana
  # (nu identica monoton de la un segment la altul).
  rate_jitter: 3
  pitch_jitter: 4

script_generation:
  provider: "gemini"
  model: "gemini-2.5-flash"
  max_tokens: 3000
  language: "ro"

trending:
  provider: "google_trends"
  geo: "RO"
  topics_count: 8

scheduling:
  daily_run_time: "18:00"
  timezone: "Europe/Bucharest"

youtube:
  category_id: "22"  # People & Blogs
  privacy_status: "public"  # private | unlisted | public
  default_tags:
    - "shorts"
    - "trending"
    - "romania"

telegram:
  notify_on_start: true
  notify_on_finish: true
  require_approval_before_upload: false
